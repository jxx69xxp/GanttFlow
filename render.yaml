services:
  - type: web
    name: ganttflow
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma db push
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
